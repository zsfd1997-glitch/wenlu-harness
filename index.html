<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文炉 Harness</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #66717f;
      --line: #d9dfd8;
      --paper: #fffefa;
      --bg: #f6f7f2;
      --accent: #b5442e;
      --green: #2f7d58;
      --danger: #b32635;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .app { display: grid; grid-template-columns: 320px minmax(0, 1fr) 300px; min-height: 100vh; }
    aside, main { padding: 18px; }
    .left { background: #17202a; color: #eef4f0; }
    .right { border-left: 1px solid var(--line); background: #fbfcf8; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 23px; }
    h2 { font-size: 16px; }
    .sub { color: #9aa7b1; font-size: 13px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 8px; background: #d8efe2; color: var(--green); font-weight: 900; }
    label { display: grid; gap: 6px; margin: 12px 0; color: #4a5968; font-size: 12px; font-weight: 800; }
    .left label { color: #d7e2dc; }
    input, select, textarea {
      width: 100%;
      border: 1px solid #cbd5cf;
      border-radius: 7px;
      background: white;
      color: var(--ink);
      font: inherit;
    }
    input, select { height: 38px; padding: 0 10px; }
    textarea { min-height: 130px; padding: 10px; resize: vertical; }
    button {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: white;
      font-weight: 900;
      cursor: pointer;
    }
    button:disabled { opacity: .62; cursor: not-allowed; }
    .hint { margin-top: 8px; color: #f3d8aa; font-size: 12px; }
    .flow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
    .flow span { padding: 8px; border: 1px solid var(--line); border-radius: 7px; background: white; text-align: center; font-size: 12px; font-weight: 800; }
    .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); overflow: hidden; box-shadow: 0 14px 36px rgba(23, 32, 42, .08); }
    .panel + .panel { margin-top: 14px; }
    .panel h2 { padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .box { padding: 14px 16px; }
    .grid, .diff { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    pre { margin: 0; white-space: pre-wrap; overflow: auto; max-height: 560px; font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .score { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .ring { display: grid; place-items: center; width: 76px; height: 76px; border: 3px solid #d7e4da; border-radius: 50%; color: var(--green); font-size: 24px; font-weight: 900; }
    .gate { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .gate small { display: block; color: var(--muted); }
    .pass { color: var(--green); }
    .fail { color: var(--danger); }
    .finding { border-left: 3px solid var(--accent); padding: 8px 10px; margin-top: 8px; background: white; }
    .removed { background: #fff0f1; color: #8f1f2a; padding: 10px; }
    .added { background: #edf8f0; color: #145c3a; padding: 10px; }
    .history { margin-top: 16px; display: grid; gap: 8px; }
    .history button { height: auto; min-height: 44px; padding: 9px 10px; background: #263545; color: #dce8e2; text-align: left; }
    @media (max-width: 980px) {
      .app, .grid, .diff { grid-template-columns: 1fr; }
      .right { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="left">
      <div class="brand">
        <div class="mark">文</div>
        <div>
          <h1>文炉 Harness</h1>
          <p class="sub">中文长篇创作审稿工作台</p>
        </div>
      </div>
      <label>任务类型
        <select id="taskType"><option>写章节</option><option>改章节</option><option>审稿</option><option>做设定</option></select>
      </label>
      <label>框架
        <select id="frameworkId">
          <option value="auto">自动路由</option>
          <option value="chapter-causality">章节因果链</option>
          <option value="seven-layer-review">七层叙事检查</option>
          <option value="anti-ai-style">反AI味检查</option>
          <option value="state-lock-ledger">状态锁账本</option>
        </select>
      </label>
      <label>Provider
        <select id="provider">
          <option value="mock">mock（无密钥演示）</option>
          <option value="openrouter">OpenRouter</option>
          <option value="xai">xAI / Grok</option>
          <option value="deepseek">DeepSeek</option>
          <option value="openai">OpenAI</option>
        </select>
      </label>
      <label>模型 <input id="model" value="harness-mock-cn"></label>
      <label>API Key <input id="apiKey" type="password" placeholder="可空；只用于本次请求，不保存"></label>
      <button id="runBtn">运行 Harness</button>
      <p class="hint">模型 key 不落库。AI 产物只进候选，不自动覆盖正稿。</p>
      <div class="history" id="history"></div>
    </aside>
    <main>
      <div class="flow"><span>任务</span><span>框架</span><span>候选</span><span>门禁</span><span>Diff</span></div>
      <section class="panel">
        <h2>输入</h2>
        <div class="box">
          <label>目标
            <textarea id="goal">为中文长篇小说生成/审查一个候选段落，要求低 AI 味、强因果、可追溯。</textarea>
          </label>
          <div class="grid">
            <label>上下文 / 设定 / 禁区
              <textarea id="contextText">主角当前称谓：刘烬。当前主场锁在铁炉镇及近郊。旧口径资产不得作为依据。AI 产物只能是候选，不能覆盖正稿。</textarea>
            </label>
            <label>候选稿 / 待审文本
              <textarea id="draftText">雨停得很慢。刘烬把账纸摊在炉边，没有急着说话。</textarea>
            </label>
          </div>
        </div>
      </section>
      <section class="panel">
        <h2>候选输出</h2>
        <div class="box"><pre id="output">等待运行。</pre></div>
      </section>
      <section class="panel">
        <h2>Diff 摘要</h2>
        <div class="box">
          <p id="diffSummary" class="sub">等待运行。</p>
          <div class="diff"><pre id="removed" class="removed"></pre><pre id="added" class="added"></pre></div>
        </div>
      </section>
    </main>
    <aside class="right">
      <div class="score"><div class="ring" id="score">--</div><div><h3>Harness 门禁</h3><p class="sub" id="decision">未运行</p></div></div>
      <div id="gates"></div>
      <div id="findings"></div>
    </aside>
  </div>
  <script>
    const endpoint = "https://ybpknmzpxzaiggnmbjqj.supabase.co/functions/v1/wenlu-harness";
    const defaults = { mock: "harness-mock-cn", openrouter: "x-ai/grok-4.1-fast", xai: "grok-4.3", deepseek: "deepseek-chat", openai: "gpt-5.1" };
    provider.onchange = () => model.value = defaults[provider.value] || "";
    runBtn.onclick = async () => {
      runBtn.disabled = true;
      output.textContent = "运行中...";
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "run",
            taskType: taskType.value,
            frameworkId: frameworkId.value,
            goal: goal.value,
            contextText: contextText.value,
            draftText: draftText.value,
            provider: provider.value,
            model: model.value,
            apiKey: apiKey.value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "请求失败");
        render(data);
        saveHistory(data);
      } catch (e) {
        output.textContent = "失败：" + e.message;
      }
      runBtn.disabled = false;
    };
    function render(data) {
      const evalData = data.evaluation || data.eval;
      output.textContent = data.output?.content || data.output || "";
      score.textContent = evalData.score;
      decision.textContent = evalData.passed ? "PASS，可进入人工 Diff" : "FAIL，禁止合并";
      decision.className = evalData.passed ? "pass" : "fail";
      gates.innerHTML = evalData.gates.map(g => '<div class="gate"><div><b>' + g.name + '</b><small>' + (g.findings.length ? g.findings.length + " 个问题" : "无阻断项") + '</small></div><b class="' + (g.score >= 78 ? "pass" : "fail") + '">' + g.score + '</b></div>').join("");
      findings.innerHTML = evalData.findings.length ? evalData.findings.map(f => '<div class="finding"><b>' + f.severity + '</b> ' + f.message + '</div>').join("") : '<p class="sub">暂无失败项。</p>';
      diffSummary.textContent = data.diff.summary;
      removed.textContent = Array.isArray(data.diff.removed) ? data.diff.removed.join("\n") : data.diff.removed;
      added.textContent = Array.isArray(data.diff.added) ? data.diff.added.join("\n") : data.diff.added;
    }
    function saveHistory(data) {
      const evalData = data.evaluation || data.eval;
      const items = JSON.parse(localStorage.getItem("wenluRuns") || "[]");
      items.unshift({ score: evalData.score, passed: evalData.passed, goal: goal.value, time: new Date().toLocaleString() });
      localStorage.setItem("wenluRuns", JSON.stringify(items.slice(0, 8)));
      drawHistory();
    }
    function drawHistory() {
      const items = JSON.parse(localStorage.getItem("wenluRuns") || "[]");
      history.innerHTML = items.length ? "<p class='sub'>本机历史</p>" + items.map(i => '<button type="button">' + (i.passed ? "PASS" : "FAIL") + " · " + i.score + " · " + i.time + "<br>" + i.goal.slice(0, 42) + "</button>").join("") : "";
    }
    drawHistory();
  </script>
</body>
</html>
