<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文炉</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap");
    :root {
      --bg: #07090d;
      --panel: rgba(16, 20, 29, .78);
      --panel-strong: rgba(20, 27, 39, .95);
      --line: rgba(132, 242, 255, .16);
      --line-strong: rgba(132, 242, 255, .34);
      --text: #eef7fa;
      --muted: #7f929d;
      --dim: #4f6069;
      --cyan: #74f2ff;
      --green: #7cffb2;
      --red: #ff657a;
      --amber: #ffd166;
      --violet: #9a7cff;
      --shadow: 0 28px 90px rgba(0, 0, 0, .42);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 72% 12%, rgba(116, 242, 255, .12), transparent 28%),
        radial-gradient(circle at 16% 88%, rgba(154, 124, 255, .11), transparent 30%),
        linear-gradient(180deg, #090c12, var(--bg));
      font: 15px/1.55 "Space Grotesk", "Noto Sans SC", sans-serif;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(132, 242, 255, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(132, 242, 255, .04) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,.18));
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, p { margin: 0; }
    .app {
      position: relative;
      display: grid;
      grid-template-columns: 250px minmax(480px, 1fr) 330px;
      gap: 16px;
      min-height: 100vh;
      padding: 16px;
    }
    .left, .right {
      align-self: start;
      position: sticky;
      top: 16px;
      display: grid;
      gap: 12px;
      max-height: calc(100vh - 32px);
      overflow: auto;
    }
    .brand, .card, .editor {
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .brand {
      padding: 16px;
      display: grid;
      gap: 14px;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .logo h1 {
      font-size: 26px;
      letter-spacing: 0;
    }
    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 22px var(--green);
    }
    .tagline {
      color: var(--muted);
      font-size: 13px;
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(5, 8, 12, .76);
      color: var(--text);
      outline: none;
    }
    input, select {
      height: 38px;
      padding: 0 11px;
    }
    textarea {
      min-height: 90px;
      padding: 11px;
      resize: vertical;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(116, 242, 255, .12);
    }
    .field-stack {
      display: grid;
      gap: 10px;
    }
    .mini {
      color: var(--dim);
      font-size: 12px;
    }
    .main {
      display: grid;
      grid-template-rows: auto minmax(560px, 1fr) auto;
      gap: 14px;
      min-height: calc(100vh - 32px);
    }
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }
    #docTitle {
      height: 54px;
      padding: 0 2px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: clamp(30px, 4.2vw, 58px);
      font-weight: 900;
      letter-spacing: 0;
    }
    #docTitle:focus { box-shadow: none; }
    .status {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }
    .pill {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 12px;
      background: rgba(10, 15, 22, .7);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .pill.hot {
      color: var(--cyan);
      border-color: var(--line-strong);
    }
    .editor {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(18, 28, 40, .96), rgba(8, 11, 17, .98));
    }
    .editor::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(116, 242, 255, .11), transparent 18%, transparent 82%, rgba(154, 124, 255, .12)),
        linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px);
      background-size: auto, 100% 32px;
    }
    .editor::after {
      content: "WRITE";
      position: absolute;
      right: 28px;
      bottom: 18px;
      color: rgba(116, 242, 255, .045);
      font-size: 92px;
      font-weight: 900;
      letter-spacing: 0;
      pointer-events: none;
    }
    #draft {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      min-height: 560px;
      border: 0;
      border-radius: 0;
      padding: clamp(26px, 4vw, 54px);
      background: transparent;
      color: #f5fbff;
      resize: none;
      font: 500 21px/1.85 "Noto Sans SC", sans-serif;
      letter-spacing: 0;
    }
    #draft::placeholder { color: rgba(238, 247, 250, .34); }
    #draft:focus { box-shadow: none; }
    .actions {
      display: grid;
      grid-template-columns: 1.2fr repeat(3, 1fr);
      gap: 10px;
    }
    .btn {
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(14, 19, 28, .9);
      color: var(--text);
      font-weight: 800;
    }
    .btn.primary {
      border-color: rgba(116, 242, 255, .58);
      background: linear-gradient(135deg, rgba(116, 242, 255, .26), rgba(154, 124, 255, .2));
      color: #f6fdff;
      box-shadow: 0 0 34px rgba(116, 242, 255, .12);
    }
    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--cyan);
    }
    .card {
      border-radius: 20px;
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    .card h2 {
      font-size: 17px;
      letter-spacing: 0;
    }
    .metric {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 14px;
      align-items: center;
    }
    .score {
      width: 82px;
      height: 82px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(124, 255, 178, .55);
      color: var(--green);
      background: rgba(124, 255, 178, .08);
      box-shadow: inset 0 0 34px rgba(124, 255, 178, .08);
      font-size: 26px;
      font-weight: 900;
    }
    .list {
      display: grid;
      gap: 8px;
    }
    .item {
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(5, 8, 12, .42);
      color: var(--muted);
      font-size: 13px;
    }
    .item strong { color: var(--text); }
    .item.good { border-color: rgba(124, 255, 178, .35); }
    .item.bad { border-color: rgba(255, 101, 122, .45); }
    .item.idea { border-color: rgba(116, 242, 255, .35); }
    pre {
      margin: 0;
      white-space: pre-wrap;
      overflow: auto;
      max-height: 360px;
      color: #dcebf0;
      font: 13px/1.7 "Noto Sans SC", sans-serif;
    }
    .git-ok { color: var(--green); }
    .git-warn { color: var(--amber); }
    .git-bad { color: var(--red); }
    @media (max-width: 1120px) {
      .app { grid-template-columns: 1fr; }
      .left, .right { position: static; max-height: none; }
      .actions { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 620px) {
      .app { padding: 10px; }
      .topbar { grid-template-columns: 1fr; }
      .status { justify-content: flex-start; }
      .actions { grid-template-columns: 1fr; }
      #draft { font-size: 18px; padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="left">
      <section class="brand">
        <div class="logo">
          <h1>文炉</h1>
          <span class="dot"></span>
        </div>
        <p class="tagline">写作优先。AI 只在需要时介入。</p>
      </section>

      <section class="card field-stack">
        <h2>Git</h2>
        <label>Owner <input id="gitOwner" value="zsfd1997-glitch"></label>
        <label>Repo <input id="gitRepo" value="wenlu-writing-vault"></label>
        <label>Path <input id="gitPath" value="drafts/current.md"></label>
        <label>Token <input id="gitToken" type="password" placeholder="Contents read/write"></label>
        <label>Interval
          <select id="gitInterval">
            <option value="0">Off</option>
            <option value="60">60s</option>
            <option value="180" selected>3m</option>
            <option value="300">5m</option>
          </select>
        </label>
        <button class="btn" id="gitSaveBtn">Git Save</button>
        <p class="mini"><span id="gitState" class="git-warn">Git 未连接</span> · <span id="lastGit">未提交</span></p>
      </section>

      <section class="card field-stack">
        <h2>Context</h2>
        <label>目标 <textarea id="goal">写一段低 AI 味、因果明确、能继续推进长篇章节的中文正文。</textarea></label>
        <label>设定 <textarea id="contextText">主角当前称谓：刘烬。当前主场锁在铁炉镇及近郊。旧口径资产不得作为依据。AI 产物只能是候选，不能覆盖正稿。</textarea></label>
        <label>Provider
          <select id="provider">
            <option value="mock">mock</option>
            <option value="openrouter">OpenRouter</option>
            <option value="xai">xAI / Grok</option>
            <option value="deepseek">DeepSeek</option>
            <option value="openai">OpenAI</option>
          </select>
        </label>
        <label>Model <input id="model" value="harness-mock-cn"></label>
        <label>API Key <input id="apiKey" type="password" placeholder="只用于本次请求"></label>
      </section>
    </aside>

    <main class="main">
      <header class="topbar">
        <input id="docTitle" value="未命名章节" aria-label="标题">
        <div class="status">
          <span class="pill hot" id="wordCount">0 字</span>
          <span class="pill" id="saveState">本机已保存</span>
          <span class="pill" id="focusState">WRITE</span>
        </div>
      </header>

      <section class="editor">
        <textarea id="draft" spellcheck="false" placeholder="直接写。需要时再点灵感、审稿、因果。"></textarea>
      </section>

      <nav class="actions">
        <button class="btn primary" id="inspireBtn">灵感</button>
        <button class="btn" id="reviewBtn">审稿</button>
        <button class="btn" id="causalityBtn">因果</button>
        <button class="btn" id="copyBtn">复制</button>
      </nav>
    </main>

    <aside class="right">
      <section class="card">
        <h2>Signal</h2>
        <div class="list" id="ideas">
          <div class="item idea"><strong>待命</strong><br>先写，不打断。</div>
        </div>
      </section>

      <section class="card">
        <h2>Harness</h2>
        <div class="metric">
          <div class="score" id="score">--</div>
          <div>
            <p id="decision">未审稿</p>
            <p class="mini" id="runMeta">未调用模型</p>
          </div>
        </div>
        <div class="list" id="gates"></div>
      </section>

      <section class="card">
        <h2>Output</h2>
        <pre id="output">结果显示在这里。正文不会被覆盖。</pre>
      </section>
    </aside>
  </div>

  <script>
    const endpoint = "https://ybpknmzpxzaiggnmbjqj.supabase.co/functions/v1/wenlu-harness";
    const defaults = { mock: "harness-mock-cn", openrouter: "x-ai/grok-4.1-fast", xai: "grok-4.3", deepseek: "deepseek-chat", openai: "gpt-5.1" };
    const storageKey = "wenlu.editor.tech.v1";
    const fields = ["docTitle", "draft", "goal", "contextText", "provider", "model", "gitOwner", "gitRepo", "gitPath", "gitInterval"];
    let saveTimer = null;
    let gitTimer = null;
    let dirtyForGit = false;

    provider.onchange = () => {
      model.value = defaults[provider.value] || model.value;
      queueSave();
    };

    for (const id of fields) {
      document.getElementById(id).addEventListener("input", queueSave);
      document.getElementById(id).addEventListener("change", queueSave);
    }
    draft.addEventListener("input", () => {
      dirtyForGit = true;
      updateStats();
    });
    gitToken.addEventListener("input", () => {
      sessionStorage.setItem("wenlu.githubToken", gitToken.value);
      updateGitState();
    });
    gitInterval.addEventListener("change", configureGitTimer);
    gitSaveBtn.onclick = () => saveToGit(true);
    inspireBtn.onclick = () => runAssist("inspire");
    reviewBtn.onclick = () => runAssist("review");
    causalityBtn.onclick = () => runAssist("causality");
    copyBtn.onclick = async () => {
      await navigator.clipboard.writeText(draft.value);
      copyBtn.textContent = "已复制";
      setTimeout(() => copyBtn.textContent = "复制", 1000);
    };

    function loadState() {
      const raw = localStorage.getItem(storageKey);
      if (raw) {
        const state = JSON.parse(raw);
        for (const id of fields) {
          if (state[id] !== undefined) document.getElementById(id).value = state[id];
        }
      }
      gitToken.value = sessionStorage.getItem("wenlu.githubToken") || "";
      updateStats();
      updateGitState();
      configureGitTimer();
    }

    function queueSave() {
      clearTimeout(saveTimer);
      saveState.textContent = "保存中";
      saveTimer = setTimeout(saveLocal, 280);
    }

    function saveLocal() {
      const state = {};
      for (const id of fields) state[id] = document.getElementById(id).value;
      state.savedAt = new Date().toISOString();
      localStorage.setItem(storageKey, JSON.stringify(state));
      saveState.textContent = "已保存 " + new Date().toLocaleTimeString();
      updateStats();
      updateGitState();
      configureGitTimer();
    }

    function updateStats() {
      wordCount.textContent = draft.value.replace(/\s/g, "").length + " 字";
    }

    function updateGitState() {
      if (!gitToken.value.trim()) {
        gitState.textContent = "Git 未连接";
        gitState.className = "git-warn";
      } else {
        gitState.textContent = dirtyForGit ? "Git 待提交" : "Git 已同步";
        gitState.className = dirtyForGit ? "git-warn" : "git-ok";
      }
    }

    function configureGitTimer() {
      clearInterval(gitTimer);
      const seconds = Number(gitInterval.value);
      if (seconds > 0) gitTimer = setInterval(() => saveToGit(false), seconds * 1000);
    }

    function buildMarkdown() {
      return `# ${docTitle.value || "未命名章节"}\n\n${draft.value}\n\n---\n保存时间：${new Date().toISOString()}\n`;
    }

    async function saveToGit(manual) {
      const token = gitToken.value.trim();
      if (!token) {
        gitState.textContent = "缺 Token";
        gitState.className = "git-bad";
        return;
      }
      if (!manual && !dirtyForGit) return;
      const owner = gitOwner.value.trim();
      const repo = gitRepo.value.trim();
      const path = gitPath.value.trim().replace(/^\/+/, "");
      const api = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path).replace(/%2F/g, "/")}`;
      gitState.textContent = "提交中";
      gitState.className = "git-warn";
      try {
        let sha;
        const getRes = await fetch(api, { headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" } });
        if (getRes.ok) sha = (await getRes.json()).sha;
        const content = btoa(unescape(encodeURIComponent(buildMarkdown())));
        const putRes = await fetch(api, {
          method: "PUT",
          headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
          body: JSON.stringify({ message: `autosave: ${docTitle.value || "draft"} ${new Date().toISOString()}`, content, sha })
        });
        if (!putRes.ok) throw new Error(await putRes.text());
        dirtyForGit = false;
        gitState.textContent = "Git 已同步";
        gitState.className = "git-ok";
        lastGit.textContent = new Date().toLocaleTimeString();
      } catch (error) {
        gitState.textContent = "Git 失败";
        gitState.className = "git-bad";
        output.textContent = "Git 保存失败：\n" + (error.message || error);
      }
    }

    async function runAssist(mode) {
      const map = {
        inspire: { taskType: "做设定", frameworkId: "chapter-causality", goal: "基于当前正文，只给 5 条继续写的灵感，不写完整正文。" },
        review: { taskType: "审稿", frameworkId: "anti-ai-style", goal: "检查 AI 味、套话、解释性对白和节奏，只给可执行修改点。" },
        causality: { taskType: "写章节", frameworkId: "chapter-causality", goal: "梳理上一段触发、本段必须发生、下一段依赖和停点。" }
      };
      const cfg = map[mode];
      output.textContent = "Running...";
      runMeta.textContent = "请求 Harness";
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "run",
            taskType: cfg.taskType,
            frameworkId: cfg.frameworkId,
            goal: cfg.goal + "\n用户目标：" + goal.value,
            contextText: contextText.value,
            draftText: draft.value,
            provider: provider.value,
            model: model.value,
            apiKey: apiKey.value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "请求失败");
        renderAssist(data, mode);
      } catch (error) {
        output.textContent = "调用失败：\n" + (error.message || error);
        runMeta.textContent = "失败";
      }
    }

    function renderAssist(data, mode) {
      const evaluation = data.evaluation || data.eval;
      const text = data.output?.content || data.output || "";
      score.textContent = evaluation.score;
      decision.textContent = evaluation.passed ? "PASS" : "FAIL";
      runMeta.textContent = `${data.framework?.name || "Harness"} · ${data.model || "model"}`;
      gates.innerHTML = evaluation.gates.map(g => `<div class="item ${g.score >= 78 ? "good" : "bad"}"><strong>${g.name} ${g.score}</strong><br>${g.findings.length ? g.findings.map(f => f.message).join("；") : "OK"}</div>`).join("");
      output.textContent = text;
      const lines = text.split("\n").filter(line => line.trim()).slice(0, 5);
      ideas.innerHTML = lines.map(line => `<div class="item idea">${escapeHtml(line.replace(/^#+\s*/, ""))}</div>`).join("") || `<div class="item idea">无结果</div>`;
      focusState.textContent = mode.toUpperCase();
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    loadState();
  </script>
</body>
</html>
